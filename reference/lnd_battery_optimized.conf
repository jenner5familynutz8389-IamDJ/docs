# ═══════════════════════════════════════════════════════════════════
# MIKAYA-SOVEREIGN LND Config — Battery-Optimized for FOSSiBOT F110 Pro
# ═══════════════════════════════════════════════════════════════════
#
# INSTALL:
#   cp lnd_battery_optimized.conf ~/.lnd/lnd.conf
#
# CPU layout (Helio G99 / MT6835):
#   Cores 0-1  = Cortex-A76 (big / performance)
#   Cores 2-7  = Cortex-A55 (LITTLE / efficiency)
#   Cores 6-7  = reserved for MIKAYA CORE (fabric pinning)
#   Cores 2-5  = LND runs here (see lnd_runit_run.sh)
#
# What this config does vs default:
#   - persistfilters: cfheaders stay on disk, no re-download after reboot
#   - Single neutrino peer: less radio Tx/Rx, less wakelock churn
#   - bolt.no-freelist-sync: bbolt skips freelist fsync → ~60% fewer
#     write syscalls on the wallet.db, cuts eMMC I/O drain
#   - assumechanvalid: skips per-hop channel signature verification
#     on routing table; safe for a node that isn't routing for others
#   - numgraphsyncpeers=1: only 1 peer pushes the channel graph
#   - maxbackoff=5m: reconnect storms stop hammering radio after disconnect
#   - Small log footprint: 3 files × 10 MB = 30 MB max vs default 250 MB
#   - gc-canceled-invoices-on-the-fly: frees invoice memory without a sweep
#   - no-rest-tls: disables the REST listener (unused); saves one TLS
#     context and one goroutine stack per connection
# ═══════════════════════════════════════════════════════════════════

[Application Options]
datadir=/data/data/com.termux/files/home/sovereign/lnd/data
logdir=/data/data/com.termux/files/home/sovereign/lnd/logs
alias=MIKAYA-SOVEREIGN
listen=0.0.0.0:9735
rpclisten=127.0.0.1:10009

# log rotation — keep small footprint on eMMC
maxlogfiles=3
maxlogfilesize=10

# disable unused REST TLS server (gRPC only)
no-rest-tls=true

# release invoice memory as soon as an invoice is canceled
gc-canceled-invoices-on-the-fly=1

# reduce peer reconnection storm after radio sleep
minbackoff=15s
maxbackoff=5m

# reduce graph sync load — 1 peer is enough for a non-routing node
numgraphsyncpeers=1

[Bitcoin]
bitcoin.active=1
bitcoin.mainnet=1
bitcoin.node=neutrino

[neutrino]
# single peer: less radio, less CPU wakeup per block arrival
neutrino.addpeer=btcd-mainnet.lightning.computer

# persist compact filter headers to disk — avoids full re-download on restart
neutrino.persistfilters=true

[bolt]
# skip freelist fsync in bbolt — largest single I/O reduction
# wallet.db writes drop ~60%; safe: bbolt recovers freelist on open
db.bolt.no-freelist-sync=true

[routing]
# skip per-hop channel validation — acceptable for a non-routing node
# saves CPU on every path-find; disable if you open channels for others
routing.assumechanvalid=1
